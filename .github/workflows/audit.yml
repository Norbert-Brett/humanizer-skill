name: StoryScope Narrative Slop Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests

      - name: Audit sample narratives
        run: |
          # The humanized sample must pass with score < 35% (exit code 0)
          python3 scripts/audit_narrative.py examples/sample_narratives/humanized_story.txt
